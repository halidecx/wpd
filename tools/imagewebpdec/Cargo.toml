# Outside the wpd workspace on purpose: nothing in wpd should depend on
# image-webp, and this harness is built only when benchmarking against it.
[package]
name = "imagewebpdec"
description = "Command-line front end for the image-webp decoder"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "BSD-2-Clause"
repository = "https://github.com/halidecx/wpd"
publish = false

# Its own workspace root, so the wpd workspace never resolves image-webp.
[workspace]

[[bin]]
name = "imagewebpdec"
path = "main.rs"
doc = false

[dependencies]
image-webp = "0.2"

[profile.release]
codegen-units = 1
lto = "fat"

[profile.minsize]
inherits = "release"
opt-level = "s"

[profile.debugopt]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
