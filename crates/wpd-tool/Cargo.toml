[package]
name = "wpd-tool"
description = "Command-line front end for the wpd WebP decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wpd"
path = "src/main.rs"

[dependencies]
wpd = { path = "../wpd", default-features = false }
wpd-capi = { path = "../wpd-capi", default-features = false }

[features]
default = ["asm"]
asm = ["wpd/asm", "wpd-capi/asm"]
trim_dsp = ["wpd/trim_dsp", "wpd-capi/trim_dsp"]
force_rac32 = ["wpd/force_rac32", "wpd-capi/force_rac32"]
